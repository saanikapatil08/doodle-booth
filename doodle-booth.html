<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doodle Booth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Patrick Hand', cursive;
      min-height: 100vh;
      background-color: #fffdf5;
      background-image: radial-gradient(circle, #d4c9a8 1px, transparent 1px);
      background-size: 28px 28px;
      padding: 24px 16px 60px;
      color: #2a2016;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: 44px;
      font-weight: 700;
      color: #2a2016;
      display: inline-block;
      position: relative;
    }
    h1::after {
      content: '';
      display: block;
      height: 5px;
      background: #f4a623;
      border-radius: 3px;
      margin-top: 2px;
      transform: rotate(-1.2deg);
    }

    .subtitle {
      font-size: 16px;
      color: #7a6a45;
      margin-top: 6px;
    }

    .booth-layout {
      display: flex;
      gap: 24px;
      max-width: 940px;
      margin: 0 auto;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    /* ── Camera column ── */
    .camera-section { flex: 1; min-width: 300px; max-width: 460px; }

    .video-frame {
      position: relative;
      border: 4px solid #2a2016;
      border-radius: 14px;
      overflow: hidden;
      background: #1a1a2e;
      aspect-ratio: 4/3;
      box-shadow: 7px 7px 0 #2a2016;
    }

    #preview {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    #sticker-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .filter-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.92);
      border: 2px solid #2a2016;
      border-radius: 20px;
      padding: 3px 14px;
      font-family: 'Caveat', cursive;
      font-size: 13px;
      font-weight: 700;
      color: #2a2016;
    }

    .countdown-display {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Caveat', cursive;
      font-size: 100px;
      font-weight: 700;
      color: #f4a623;
      text-shadow: 4px 4px 0 #2a2016;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    /* ── Buttons ── */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Caveat', cursive;
      font-size: 18px;
      font-weight: 700;
      border: 3px solid #2a2016;
      border-radius: 40px;
      padding: 8px 22px;
      cursor: pointer;
      background: #fff;
      color: #2a2016;
      box-shadow: 3px 3px 0 #2a2016;
      transition: transform 0.1s, box-shadow 0.1s;
      white-space: nowrap;
    }
    .btn:hover { background: #faf4e0; }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #2a2016; }

    .btn-snap  { background: #f4a623; font-size: 22px; padding: 10px 32px; }
    .btn-snap:hover { background: #e59612; }
    .btn-clear { background: #ffe0e0; }
    .btn-start { background: #d4f0d4; }
    .btn-dl    { background: #e0d4f4; }
    .btn-gif   { background: #ffd4ec; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: 3px 3px 0 #2a2016; }

    /* ── Timer picker ── */
    .section-label {
      font-family: 'Caveat', cursive;
      font-size: 16px;
      color: #7a6a45;
      text-align: center;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .timer-row {
      display: flex; gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .timer-pill {
      font-family: 'Caveat', cursive;
      font-size: 16px;
      border: 2px solid #2a2016;
      border-radius: 20px;
      padding: 4px 16px;
      cursor: pointer;
      background: #fff;
      color: #2a2016;
      transition: background 0.15s;
    }
    .timer-pill.active { background: #2a2016; color: #fff; }

    /* ── Filters ── */
    .filter-row {
      display: flex; gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .filter-pill {
      font-family: 'Caveat', cursive;
      font-size: 15px;
      border: 2px solid #2a2016;
      border-radius: 20px;
      padding: 4px 14px;
      cursor: pointer;
      background: #fff;
      color: #2a2016;
      transition: background 0.15s;
    }
    .filter-pill.active { background: #2a2016; color: #fff; }

    /* ── Stickers ── */
    .sticker-row {
      display: flex; gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .sticker-btn {
      font-size: 26px;
      border: 2.5px solid #2a2016;
      border-radius: 10px;
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      background: #fff;
      box-shadow: 2px 2px 0 #2a2016;
      transition: transform 0.1s;
      user-select: none;
    }
    .sticker-btn:active { transform: scale(0.9); }

    /* ── Strip column ── */
    .strip-section { flex: 0 0 210px; min-width: 190px; }

    .strip-label {
      font-family: 'Caveat', cursive;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
    }

    .photo-strip {
      border: 4px solid #2a2016;
      border-radius: 12px;
      background: #fff;
      padding: 10px 8px;
      box-shadow: 6px 6px 0 #2a2016;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .strip-slot {
      border: 2.5px dashed #c5b58a;
      border-radius: 8px;
      background: #fffdf5;
      aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .strip-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .strip-slot .empty-label {
      font-family: 'Caveat', cursive;
      font-size: 14px;
      color: #c5b58a;
    }

    .strip-footer {
      font-family: 'Caveat', cursive;
      font-size: 13px;
      text-align: center;
      color: #7a6a45;
      margin-top: 4px;
    }

    /* ── GIF status ── */
    #gif-status {
      font-family: 'Caveat', cursive;
      font-size: 15px;
      text-align: center;
      color: #7a6a45;
      margin-top: 8px;
      min-height: 22px;
    }

    /* hidden canvases */
    #capture-canvas, #strip-canvas { display: none; }
  </style>
</head>
<body>

<header>
  <h1>Doodle Booth</h1>
  <p class="subtitle">Strike a pose ~ snap a memory</p>
</header>

<div class="booth-layout">

  <!-- Camera -->
  <div class="camera-section">
    <div class="video-frame">
      <video id="preview" autoplay playsinline muted></video>
      <canvas id="sticker-overlay"></canvas>
      <div class="filter-badge" id="filter-badge">Normal</div>
      <div class="countdown-display" id="countdown"></div>
    </div>

    <div class="controls-row">
      <button class="btn btn-start" id="startBtn" onclick="startCamera()">Start Camera</button>
      <button class="btn btn-snap"  id="snapBtn"  onclick="startCountdown()" style="display:none">Snap!</button>
      <button class="btn btn-clear" id="clearBtn" onclick="clearStrip()"     style="display:none">Clear Strip</button>
    </div>

    <!-- Timer -->
    <p class="section-label">Countdown Timer</p>
    <div class="timer-row">
      <div class="timer-pill active" data-sec="3"  onclick="setTimer(this)">3s</div>
      <div class="timer-pill"        data-sec="5"  onclick="setTimer(this)">5s</div>
      <div class="timer-pill"        data-sec="10" onclick="setTimer(this)">10s</div>
    </div>

    <!-- Filters -->
    <p class="section-label">Filters</p>
    <div class="filter-row">
      <div class="filter-pill active" onclick="setFilter(this,'none','Normal')">Normal</div>
      <div class="filter-pill" onclick="setFilter(this,'grayscale(100%)','B&amp;W')">B&W</div>
      <div class="filter-pill" onclick="setFilter(this,'sepia(80%)','Vintage')">Vintage</div>
      <div class="filter-pill" onclick="setFilter(this,'hue-rotate(90deg)','Dream')">Dream</div>
      <div class="filter-pill" onclick="setFilter(this,'saturate(200%) contrast(1.2)','Vivid')">Vivid</div>
      <div class="filter-pill" onclick="setFilter(this,'invert(100%)','Invert')">Invert</div>
    </div>

    <!-- Stickers -->
    <p class="section-label">Stickers (tap to stamp)</p>
    <div class="sticker-row">
      <div class="sticker-btn" onclick="addSticker('⭐')">⭐</div>
      <div class="sticker-btn" onclick="addSticker('🌈')">🌈</div>
      <div class="sticker-btn" onclick="addSticker('💛')">💛</div>
      <div class="sticker-btn" onclick="addSticker('🎉')">🎉</div>
      <div class="sticker-btn" onclick="addSticker('🌸')">🌸</div>
      <div class="sticker-btn" onclick="addSticker('✨')">✨</div>
      <div class="sticker-btn" onclick="addSticker('🦋')">🦋</div>
      <div class="sticker-btn" onclick="addSticker('🍀')">🍀</div>
    </div>
  </div>

  <!-- Strip -->
  <div class="strip-section">
    <div class="strip-label">Photo Strip</div>
    <div class="photo-strip" id="strip">
      <div class="strip-slot" id="slot0"><span class="empty-label">Photo 1</span></div>
      <div class="strip-slot" id="slot1"><span class="empty-label">Photo 2</span></div>
      <div class="strip-slot" id="slot2"><span class="empty-label">Photo 3</span></div>
    </div>
    <div class="strip-footer" id="strip-date"></div>

    <div class="controls-row" style="margin-top:14px; flex-direction:column; gap:10px;">
      <button class="btn btn-dl"  id="dlBtn"  onclick="downloadStrip()" style="display:none">Download Strip</button>
      <button class="btn btn-gif" id="gifBtn" onclick="exportGif()"     style="display:none">Export GIF</button>
    </div>
    <div id="gif-status"></div>
  </div>

</div>

<!-- Hidden canvases -->
<canvas id="capture-canvas"></canvas>
<canvas id="strip-canvas"></canvas>

<script>
  /* ── State ── */
  const video      = document.getElementById('preview');
  const countdownEl = document.getElementById('countdown');
  const filterBadge = document.getElementById('filter-badge');

  let currentFilter = 'none';
  let stickers = [];
  let photos   = [];       // array of dataURLs (max 3)
  let stream   = null;
  let capturing = false;
  let timerSec  = 3;

  /* Date stamp */
  document.getElementById('strip-date').textContent =
    new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  /* ── Camera ── */
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
      video.srcObject = stream;
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('snapBtn').style.display  = 'inline-block';
      document.getElementById('clearBtn').style.display = 'inline-block';
      video.style.filter = currentFilter === 'none' ? '' : currentFilter;
    } catch(e) {
      alert('Camera access denied. Please allow camera permission and refresh.');
    }
  }

  /* ── Timer picker ── */
  function setTimer(el) {
    document.querySelectorAll('.timer-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    timerSec = parseInt(el.dataset.sec);
  }

  /* ── Filter ── */
  function setFilter(el, filter, name) {
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    currentFilter = filter;
    filterBadge.textContent = name;
    video.style.filter = filter === 'none' ? '' : filter;
  }

  /* ── Sticker overlay ── */
  function addSticker(emoji) {
    const overlay = document.getElementById('sticker-overlay');
    if (!overlay.width || overlay.width !== overlay.offsetWidth) {
      overlay.width  = overlay.offsetWidth;
      overlay.height = overlay.offsetHeight;
    }
    const x = 20 + Math.random() * (overlay.width  - 70);
    const y = 10 + Math.random() * (overlay.height - 70);
    stickers.push({ emoji, x, y, size: 30 + Math.floor(Math.random() * 18) });
    drawStickers();
  }

  function drawStickers() {
    const overlay = document.getElementById('sticker-overlay');
    overlay.width  = overlay.offsetWidth;
    overlay.height = overlay.offsetHeight;
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    stickers.forEach(s => {
      ctx.font = s.size + 'px serif';
      ctx.fillText(s.emoji, s.x, s.y + s.size);
    });
  }

  /* ── Countdown ── */
  function startCountdown() {
    if (capturing) return;
    if (!stream) { startCamera(); return; }
    if (photos.length >= 3) { alert('Strip is full! Clear to start again.'); return; }

    capturing = true;
    let count = timerSec;
    countdownEl.style.opacity = '1';
    countdownEl.textContent = count;

    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        countdownEl.textContent = count;
      } else {
        clearInterval(interval);
        countdownEl.textContent = '📸';
        setTimeout(() => {
          capturePhoto();
          countdownEl.style.opacity = '0';
          capturing = false;
        }, 400);
      }
    }, 1000);
  }

  /* ── Capture ── */
  function capturePhoto() {
    const cap = document.getElementById('capture-canvas');
    cap.width  = video.videoWidth  || 640;
    cap.height = video.videoHeight || 480;
    const ctx = cap.getContext('2d');

    /* Mirror + filter */
    ctx.save();
    ctx.translate(cap.width, 0);
    ctx.scale(-1, 1);
    if (currentFilter !== 'none') ctx.filter = currentFilter;
    ctx.drawImage(video, 0, 0, cap.width, cap.height);
    ctx.restore();
    ctx.filter = 'none';

    /* Bake stickers */
    const overlay = document.getElementById('sticker-overlay');
    const sx = cap.width  / overlay.offsetWidth;
    const sy = cap.height / overlay.offsetHeight;
    stickers.forEach(s => {
      const fs = s.size * Math.min(sx, sy);
      ctx.font = fs + 'px serif';
      ctx.fillText(s.emoji, s.x * sx, (s.y + s.size) * sy);
    });

    const dataUrl = cap.toDataURL('image/jpeg', 0.92);
    const idx = photos.length;
    photos.push(dataUrl);
    stickers = [];
    drawStickers();
    renderSlot(idx, dataUrl);

    if (photos.length >= 3) {
      document.getElementById('dlBtn').style.display  = 'inline-block';
      document.getElementById('gifBtn').style.display = 'inline-block';
    }
  }

  function renderSlot(idx, dataUrl) {
    const slot = document.getElementById('slot' + idx);
    slot.innerHTML = '';
    const img = new Image();
    img.src = dataUrl;
    slot.appendChild(img);
  }

  /* ── Clear ── */
  function clearStrip() {
    photos = []; stickers = [];
    drawStickers();
    for (let i = 0; i < 3; i++) {
      const slot = document.getElementById('slot' + i);
      slot.innerHTML = '<span class="empty-label">Photo ' + (i+1) + '</span>';
    }
    document.getElementById('dlBtn').style.display  = 'none';
    document.getElementById('gifBtn').style.display = 'none';
    document.getElementById('gif-status').textContent = '';
  }

  /* ── Download JPEG strip ── */
  function downloadStrip() {
    if (photos.length === 0) return;
    buildStripCanvas().then(sc => {
      const a = document.createElement('a');
      a.download = 'doodle-booth-strip.jpg';
      a.href = sc.toDataURL('image/jpeg', 0.95);
      a.click();
    });
  }

  function buildStripCanvas() {
    return new Promise(resolve => {
      const sc  = document.getElementById('strip-canvas');
      const W   = 420;
      const PH  = 296;   // photo height
      const PAD = 12;
      const TOP = 56;
      const BOT = 40;
      sc.width  = W;
      sc.height = TOP + photos.length * (PH + PAD) + BOT;
      const ctx = sc.getContext('2d');

      /* Background */
      ctx.fillStyle = '#fffdf5';
      ctx.fillRect(0, 0, sc.width, sc.height);

      /* Outer border */
      ctx.strokeStyle = '#2a2016';
      ctx.lineWidth   = 8;
      roundRect(ctx, 4, 4, sc.width - 8, sc.height - 8, 14);
      ctx.stroke();

      /* Title */
      ctx.fillStyle  = '#2a2016';
      ctx.font       = 'bold 34px "Caveat", cursive';
      ctx.textAlign  = 'center';
      ctx.fillText('Doodle Booth', W / 2, 40);

      const loads = photos.map(src => new Promise(res => {
        const img = new Image(); img.onload = () => res(img); img.src = src;
      }));

      Promise.all(loads).then(imgs => {
        imgs.forEach((img, i) => {
          const x = PAD;
          const y = TOP + i * (PH + PAD);
          const iw = W - PAD * 2;
          ctx.save();
          ctx.beginPath();
          roundRect(ctx, x, y, iw, PH, 8);
          ctx.clip();
          ctx.drawImage(img, x, y, iw, PH);
          ctx.restore();
          ctx.strokeStyle = '#2a2016';
          ctx.lineWidth   = 3;
          roundRect(ctx, x, y, iw, PH, 8);
          ctx.stroke();
        });

        /* Date footer */
        ctx.fillStyle = '#7a6a45';
        ctx.font      = '18px "Caveat", cursive';
        ctx.textAlign = 'center';
        ctx.fillText(
          new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),
          W / 2, sc.height - 12
        );
        resolve(sc);
      });
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  /* ── GIF Export ── */
  function exportGif() {
    if (photos.length === 0) return;
    if (typeof GIF === 'undefined') {
      document.getElementById('gif-status').textContent = 'GIF library not loaded yet, try again.';
      return;
    }

    const statusEl = document.getElementById('gif-status');
    const gifBtn   = document.getElementById('gifBtn');
    gifBtn.disabled = true;
    statusEl.textContent = 'Building GIF…';

    const W = 420, H = 315;
    const tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = H;
    const ctx = tmp.getContext('2d');

    const gif = new GIF({
      workers: 2,
      quality: 10,
      width:   W,
      height:  H,
      workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
    });

    const loads = photos.map(src => new Promise(res => {
      const img = new Image(); img.onload = () => res(img); img.src = src;
    }));

    Promise.all(loads).then(imgs => {
      /* Frame for each photo */
      imgs.forEach((img, i) => {
        ctx.fillStyle = '#fffdf5';
        ctx.fillRect(0, 0, W, H);

        /* Doodle frame border */
        ctx.strokeStyle = '#2a2016';
        ctx.lineWidth   = 8;
        ctx.strokeRect(4, 4, W - 8, H - 8);

        /* Photo */
        ctx.save();
        roundRect(ctx, 12, 12, W - 24, H - 24, 8);
        ctx.clip();
        ctx.drawImage(img, 12, 12, W - 24, H - 24);
        ctx.restore();

        /* Photo number label */
        ctx.fillStyle = 'rgba(255,253,245,0.85)';
        ctx.fillRect(12, H - 42, 60, 30);
        ctx.fillStyle  = '#2a2016';
        ctx.font       = 'bold 22px serif';
        ctx.textAlign  = 'left';
        ctx.fillText((i + 1) + '/3', 18, H - 20);

        gif.addFrame(ctx, { copy: true, delay: 900 });
      });

      /* Composite strip frame */
      buildStripCanvas().then(sc => {
        const stripH = Math.round(H * (sc.height / sc.width));
        ctx.fillStyle = '#fffdf5';
        ctx.fillRect(0, 0, W, H);
        ctx.drawImage(sc, 0, 0, W, H);
        gif.addFrame(ctx, { copy: true, delay: 2000 });

        gif.on('progress', p => {
          statusEl.textContent = 'Encoding… ' + Math.round(p * 100) + '%';
        });

        gif.on('finished', blob => {
          const url = URL.createObjectURL(blob);
          const a   = document.createElement('a');
          a.href     = url;
          a.download = 'doodle-booth.gif';
          a.click();
          URL.revokeObjectURL(url);
          statusEl.textContent = 'GIF saved!';
          gifBtn.disabled = false;
          setTimeout(() => { statusEl.textContent = ''; }, 3000);
        });

        gif.render();
      });
    });
  }
</script>
</body>
</html>
